<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>писькад</title>
    <style>
        /* Базовые настройки */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            overflow: hidden; 
            height: 100%; 
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            perspective: 1000px;
            position: relative;
        }

        /* Размытый фон */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://static.rozetked.me/imager/full/images/uploads/mUIkM061Ljzp.jpg') center/cover no-repeat;
            filter: blur(8px);
            transform: scale(1.05);
            z-index: -1;
        }

        /* 
         * 1. ВНЕШНЯЯ ОБЕРТКА (Отвечает только за анимацию вылета)
         */
        .glass-panel-wrapper {
            width: 92%;
            max-width: 580px;
            transform-style: preserve-3d;
            
            /* Стартовая позиция вылета */
            opacity: 0;
            transform: translateY(50px) scale(0.95);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Активация вылета */
        body.page-loaded .glass-panel-wrapper {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* 
         * 2. ВНУТРЕННЯЯ ПАНЕЛЬ (Отвечает за дизайн и 3D-вращение мышью)
         */
        .glass-panel {
            background: rgba(15, 15, 15, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
            
            transform-style: preserve-3d;
            will-change: transform;
            /* Быстрая анимация для следования за мышью */
            transition: transform 0.1s ease-out;
        }

        /* --- ЭФФЕКТ КАСКАДА ДЛЯ КНОПОК --- */
        .header, .nav-card {
            opacity: 0;
            transform: translateY(30px) scale(0.96);
            will-change: transform, opacity;
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.page-loaded .header {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition-delay: 0.1s;
        }

        body.page-loaded .nav-card:nth-child(1) { transition-delay: 0.22s; opacity: 1; transform: translateY(0) scale(1); }
        body.page-loaded .nav-card:nth-child(2) { transition-delay: 0.34s; opacity: 1; transform: translateY(0) scale(1); }
        body.page-loaded .nav-card:nth-child(3) { transition-delay: 0.46s; opacity: 1; transform: translateY(0) scale(1); }

        /* --- ПОСЛЕ ЗАГРУЗКИ: РЕЖИМ МГНОВЕННОГО ИНТЕРАКТИВА --- */
        body.page-ready .nav-card {
            transition-delay: 0s !important;
            transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1),
                        background 0.18s ease-out,
                        border-color 0.18s ease-out,
                        box-shadow 0.18s ease-out !important;
        }

        /* Остальные стили для шапки, кнопок и иконок */
        .header { text-align: center; margin-bottom: 28px; }
        .header h1 { font-family: monospace; font-size: 28px; letter-spacing: 1px; margin-bottom: 6px; }
        
        .nav-grid { display: flex; flex-direction: column; gap: 12px; }

        .nav-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 18px 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        /* Ховер срабатывает ТОЛЬКО после завершения анимации вылета (body.page-ready) */
        body.page-ready .nav-card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px) scale(1.015) !important;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        body.page-ready .nav-card:active {
            transform: scale(0.97) !important;
            transition: transform 0.08s ease !important;
            background: rgba(255, 255, 255, 0.08);
        }

        .card-info h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .card-info p { font-size: 13px; color: #aaa; line-height: 1.35; }
        .card-icon { width: 20px; height: 20px; object-fit: cover; border-radius: 4px; display: inline-block; }
        .card-icon.avatar-icon { border-radius: 50%; }

        .badge-btn {
            font-size: 13px; font-weight: 600; padding: 8px 14px;
            background: rgba(255, 255, 255, 0.08); border-radius: 10px;
            white-space: nowrap; transition: background 0.18s ease-out, transform 0.18s ease-out;
        }

        body.page-ready .nav-card:hover .badge-btn {
            background: rgba(255, 255, 255, 0.22); transform: translateX(2px);
        }

        @media (max-width: 520px) {
            .glass-panel { padding: 24px 16px; border-radius: 20px; }
            .nav-card { padding: 14px; }
            .badge-btn { padding: 6px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- ВНЕШНЯЯ ОБЕРТКА: отвечает за вылет -->
    <div class="glass-panel-wrapper" id="glassPanelWrapper">
        
        <!-- ВНУТРЕННЯЯ ПАНЕЛЬ: отвечает за 3D-поворот мышью -->
        <div class="glass-panel" id="glassPanel">
            
            <div class="header">
                <h1>писькад</h1>
            </div>

            <div class="nav-grid">
                <a href="iosexploits/" class="nav-card">
                    <div class="card-info">
                        <h2><img src="/icons/shortcuts.png" alt="Shortcuts" class="card-icon"> Shortcuts</h2>
                        <p>Эксплоиты на основе ярлыков и приложении комманды</p>
                    </div>
                    <span class="badge-btn">Открыть →</span>
                </a>

                <a href="https://profile.larp.pp.ua/" class="nav-card">
                    <div class="card-info">
                        <h2><img src="/icons/avatar.jpg" alt="Профиль" class="card-icon avatar-icon"> Профиль</h2>
                        <p>Информация обо мне, соцсети</p>
                    </div>
                    <span class="badge-btn">Перейти →</span>
                </a>

                <a href="https://www.tiktok.com/@funduk_40/video/7672901929906736415" class="nav-card">
                    <div class="card-info">
                        <h2><img src="/icons/image.png" alt="larp" class="card-icon avatar-icon"> larp333</h2>
                        <p>ларп это типо скулшутинг и луксмаксинг</p>
                    </div>
                    <span class="badge-btn">Перейти →</span>
                </a>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const wrapper = document.getElementById('glassPanelWrapper');
            const panel = document.getElementById('glassPanel');

            // 1. Запуск вылета элементов
            requestAnimationFrame(() => {
                setTimeout(() => { document.body.classList.add('page-loaded'); }, 50);
            });

            // 2. Включаем интерактивы кнопок (hover/active) после окончания стартовых анимаций
            setTimeout(() => {
                document.body.classList.add('page-ready');
            }, 1000);

            // 3. Перехват кликов для красивого ухода элементов вниз перед переходом
            document.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', function(e) {
                    const href = this.getAttribute('href');
                    const target = this.getAttribute('target');

                    if (!href || href.startsWith('#') || href.startsWith('javascript:') || target === '_blank') return;
                    e.preventDefault();

                    // Сбрасываем задержки при уходе, чтобы всё скрывалось одновременно
                    document.querySelectorAll('.header, .nav-card').forEach(el => { el.style.transitionDelay = '0s'; });

                    if (wrapper) {
                        wrapper.style.transition = 'opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
                    }
                    
                    document.body.classList.remove('page-loaded');
                    document.body.classList.remove('page-ready'); 

                    setTimeout(() => { window.location.href = href; }, 500);
                });
            });

            // 4. 3D TILT EFFECT (Работает всегда, даже во время вылета)
            if (window.matchMedia('(hover: hover)').matches && wrapper && panel) {
                // Слушаем движение мыши по всему документу
                document.addEventListener('mousemove', (e) => {
                    // Пересчитываем координаты относительно обертки (которая летит)
                    const rect = wrapper.getBoundingClientRect();
                    const panelCenterX = rect.left + rect.width / 2;
                    const panelCenterY = rect.top + rect.height / 2;

                    const x = (e.clientX - panelCenterX) / (rect.width / 2);
                    const y = (e.clientY - panelCenterY) / (rect.height / 2);

                    const maxTilt = 7;
                    const tiltX = -y * maxTilt;
                    const tiltY = x * maxTilt;

                    panel.style.transition = 'transform 0.1s ease-out';
                    panel.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
                });

                // Возврат в исходное положение если мышь ушла за окно браузера
                document.addEventListener('mouseleave', () => {
                    panel.style.transition = 'transform 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
                    panel.style.transform = 'rotateX(0deg) rotateY(0deg)';
                });
            }
        });

        // 5. Фикс для Safari/iOS при возврате назад
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                document.body.classList.add('page-loaded', 'page-ready');
            }
        });
    </script>

</body>
</html>
