<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>писькад</title>
    <style>
        /* Базовые настройки и шрифт в стиле iOS */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Полностью блокируем любую прокрутку */
        html, body {
            overflow: hidden; 
            height: 100%; 
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            perspective: 1000px;
            position: relative;
        }

        /* Размытый фоновый рисунок */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://static.rozetked.me/imager/full/images/uploads/mUIkM061Ljzp.jpg') center/cover no-repeat;
            filter: blur(8px);
            transform: scale(1.05); /* Убирает прозрачные края после размытия */
            z-index: -1;
        }

        /* Главная панель с 3D-наклоном и эффектом матового стекла */
        .glass-panel {
            background: rgba(15, 15, 15, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            width: 92%;
            max-width: 580px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
            
            transform-style: preserve-3d;
            will-change: transform, opacity;

            /* Вылет основной панели */
            opacity: 0;
            transform: translateY(50px) scale(0.95);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Активация панели */
        body.page-loaded .glass-panel {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* --- ЭФФЕКТ ВЫЛЕТА ЭЛЕМЕНТОВ (КАСКАД) --- */
        .header, .nav-card {
            opacity: 0;
            transform: translateY(30px) scale(0.96);
            will-change: transform, opacity;
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                        background 0.2s ease,
                        border-color 0.2s ease,
                        box-shadow 0.2s ease;
        }

        /* Поочередное всплытие при загрузке страницы */
        body.page-loaded .header {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition-delay: 0.1s;
        }

        body.page-loaded .nav-card:nth-child(1) {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition-delay: 0.22s;
        }

        body.page-loaded .nav-card:nth-child(2) {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition-delay: 0.34s;
        }

        body.page-loaded .nav-card:nth-child(3) {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition-delay: 0.46s;
        }

        /* Шапка */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.15);
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .header h1 {
            font-family: monospace;
            font-size: 28px;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Сетка разделов */
        .nav-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Навигационная карточка (Кнопка) */
        .nav-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 18px 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        /* Мгновенный отклик при НАВЕДЕНИИ (уменьшена задержка до 0.12s) */
        .nav-card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px) scale(1.015) !important;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            
            /* Быстрый реактивный transition именно в момент наводки */
            transition: transform 0.12s ease-out,
                        background 0.12s ease-out,
                        border-color 0.12s ease-out,
                        box-shadow 0.12s ease-out !important;
        }

        /* Клики/Тапы по кнопке (быстрый iOS-отклик) */
        .nav-card:active {
            transform: scale(0.97) !important;
            transition: transform 0.08s ease !important;
            background: rgba(255, 255, 255, 0.08);
        }

        .card-info h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-info p {
            font-size: 13px;
            color: #aaa;
            line-height: 1.35;
        }

        /* Кнопка-стрелка внутри карточки */
        .badge-btn {
            font-size: 13px;
            font-weight: 600;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            white-space: nowrap;
            transition: background 0.12s ease-out, transform 0.12s ease-out;
        }

        .nav-card:hover .badge-btn {
            background: rgba(255, 255, 255, 0.22);
            transform: translateX(2px);
        }

        /* Футер */
        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }

        /* Адаптивность для мобильных */
        @media (max-width: 520px) {
            .glass-panel {
                padding: 24px 16px;
                border-radius: 20px;
            }

            .nav-card {
                padding: 14px;
            }

            .badge-btn {
                padding: 6px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="glass-panel" id="glassPanel">
        
        <!-- Шапка главной страницы -->
        <div class="header">
            <h1>писькад</h1>
        </div>

        <!-- Навигационные карточки перехода -->
        <div class="nav-grid">
            
            <a href="iosexploits/" class="nav-card">
                <div class="card-info">
                    <h2>⚡ Shortcuts</h2>
                    <p>Эксплоиты на основе ярлыков и приложении комманды</p>
                </div>
                <span class="badge-btn">Открыть →</span>
            </a>

            <a href="profile/" class="nav-card">
                <div class="card-info">
                    <h2>👤 Профиль</h2>
                    <p>Информация обо мне, соцсети</p>
                </div>
                <span class="badge-btn">Перейти →</span>
            </a>

        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const panel = document.getElementById('glassPanel');

            // 1. Активируем плавное появление (панель + каскад элементов)
            requestAnimationFrame(() => {
                setTimeout(() => {
                    document.body.classList.add('page-loaded');
                }, 50);
            });

            // 2. Перехват кликов для красивого ухода элементов вниз перед переходом
            document.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', function(e) {
                    const href = this.getAttribute('href');
                    const target = this.getAttribute('target');

                    if (!href || href.startsWith('#') || href.startsWith('javascript:') || target === '_blank') {
                        return;
                    }

                    e.preventDefault();

                    // Сбрасываем задержки при уходе, чтобы всё скрывалось одновременно
                    document.querySelectorAll('.header, .nav-card').forEach(el => {
                        el.style.transitionDelay = '0s';
                    });

                    if (panel) {
                        panel.style.transition = 'opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
                    }
                    
                    document.body.classList.remove('page-loaded');

                    setTimeout(() => {
                        window.location.href = href;
                    }, 500);
                });
            });

            // 3. 3D TILT EFFECT (Только для ПК, адаптированный под анимацию)
            if (window.matchMedia('(hover: hover)').matches && panel) {
                panel.addEventListener('mousemove', (e) => {
                    const rect = panel.getBoundingClientRect();
                    
                    const panelCenterX = rect.left + rect.width / 2;
                    const panelCenterY = rect.top + rect.height / 2;

                    const x = (e.clientX - panelCenterX) / (rect.width / 2);
                    const y = (e.clientY - panelCenterY) / (rect.height / 2);

                    const maxTilt = 7;
                    const tiltX = -y * maxTilt;
                    const tiltY = x * maxTilt;

                    panel.style.transition = 'transform 0.1s ease-out';
                    panel.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
                });

                panel.addEventListener('mouseleave', () => {
                    panel.style.transition = 'transform 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
                    panel.style.transform = 'rotateX(0deg) rotateY(0deg)';
                });
            }
        });

        // 4. Фикс для Safari/iOS при свайпе "назад"
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                document.body.classList.add('page-loaded');
            }
        });
    </script>

</body>
</html>
