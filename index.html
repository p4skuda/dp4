<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>писькад</title>
    <style>
        /* Базовые настройки и шрифт в стиле iOS */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            perspective: 1000px;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 20px 0;
            position: relative;
        }

        /* Размытый фоновый рисунок */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://static.rozetked.me/imager/full/images/uploads/mUIkM061Ljzp.jpg') center/cover no-repeat;
            filter: blur(8px); /* Небольшое размытие фона */
            transform: scale(1.05); /* Убирает прозрачные края после размытия */
            z-index: -1;
        }

        /* Главная панель с 3D-наклоном и эффектом матового стекла */
        .glass-panel {
            background: rgba(15, 15, 15, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            width: 92%;
            max-width: 580px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
            
            transition: transform 0.5s ease;
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* Шапка */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.15);
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .header h1 {
            font-family: monospace;
            font-size: 28px;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Сетка разделов */
        .nav-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Навигационная карточка */
        .nav-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 18px 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.25s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }

        .nav-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .card-info h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-info p {
            font-size: 13px;
            color: #aaa;
            line-height: 1.35;
        }

        /* Кнопка-стрелка */
        .badge-btn {
            font-size: 13px;
            font-weight: 600;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .nav-card:hover .badge-btn {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Футер */
        .footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }

        /* Адаптивность для мобильных */
        @media (max-width: 520px) {
            body {
                align-items: flex-start;
                padding: 16px 0;
            }

            .glass-panel {
                padding: 24px 16px;
                border-radius: 20px;
            }

            .nav-card {
                padding: 14px;
            }

            .badge-btn {
                padding: 6px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="glass-panel" id="glassPanel">
        
        <!-- Шапка главной страницы -->
        <div class="header">
            <h1>писькад</h1>
        </div>

        <!-- Навигационные карточки перехода -->
        <div class="nav-grid">
            
            <a href="iosexploits/" class="nav-card">
                <div class="card-info">
                    <h2>⚡ Shortcuts</h2>
                    <p>Эксплоиты на основе ярлыков и приложении комманды</p>
                </div>
                <span class="badge-btn">Открыть →</span>
            </a>

            <a href="profile/" class="nav-card">
                <div class="card-info">
                    <h2>👤 Профиль</h2>
                    <p>Информация обо мне, соцсети</p>
                </div>
                <span class="badge-btn">Перейти →</span>
            </a>

        </div>

    </div>

    <script>
        // --- 3D TILT EFFECT (Только для устройств с мышами) ---
        if (window.matchMedia('(hover: hover)').matches) {
            const panel = document.getElementById('glassPanel');

            panel.addEventListener('mousemove', (e) => {
                const rect = panel.getBoundingClientRect();
                
                const panelCenterX = rect.left + rect.width / 2;
                const panelCenterY = rect.top + rect.height / 2;

                const x = (e.clientX - panelCenterX) / (rect.width / 2);
                const y = (e.clientY - panelCenterY) / (rect.height / 2);

                const maxTilt = 10;

                const tiltX = -y * maxTilt;
                const tiltY = x * maxTilt;

                panel.style.transition = 'transform 0.1s ease-out';
                panel.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
            });

            panel.addEventListener('mouseleave', () => {
                panel.style.transition = 'transform 0.5s ease';
                panel.style.transform = 'rotateX(0deg) rotateY(0deg)';
            });
        }
    </script>

</body>
</html>
