<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>писькад</title>
    <style>
        /* Базовые настройки и шрифт в стиле iOS */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Блокируем прокрутку */
        html, body {
            overflow: hidden; 
            height: 100%; 
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            perspective: 1000px;
            position: relative;
        }

        /* Размытый фоновый рисунок */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://static.rozetked.me/imager/full/images/uploads/mUIkM061Ljzp.jpg') center/cover no-repeat;
            filter: blur(8px);
            transform: scale(1.05);
            z-index: -1;
        }

        /* Главный контейнер с 3D-наклоном и Liquid Glass */
        .glass-panel {
            position: relative;
            background: rgba(15, 15, 15, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            width: 92%;
            max-width: 620px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);

            transform-style: preserve-3d;
            will-change: transform, opacity;

            /* Начальное состояние анимации появления */
            opacity: 0;
            transform: translateY(50px) scale(0.95);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Появление главной панели */
        body.page-loaded .glass-panel {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* --- СТАРТОВЫЙ ВЫЛЕТ ЭЛЕМЕНТОВ (КАСКАД) --- */
        .back-btn, .header, .card {
            opacity: 0;
            transform: translateY(30px) scale(0.96);
            will-change: transform, opacity;
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Поочередность вылета */
        body.page-loaded .back-btn {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition-delay: 0.05s;
        }

        body.page-loaded .header {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition-delay: 0.12s;
        }

        body.page-loaded .profile-card {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition-delay: 0.24s;
        }

        body.page-loaded .player-card {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition-delay: 0.36s;
        }

        /* --- РЕЖИМ МГНОВЕННОГО ОТКЛИКА (ПОСЛЕ ЗАГРУЗКИ) --- */
        body.page-ready .back-btn,
        body.page-ready .card {
            transition-delay: 0s !important;
            transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1),
                        background 0.18s ease-out,
                        border-color 0.18s ease-out,
                        box-shadow 0.18s ease-out,
                        color 0.18s ease-out,
                        opacity 0.4s ease !important;
        }

        /* Кнопка Назад */
        .back-btn {
            position: absolute;
            top: 28px;
            left: 28px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            z-index: 10;
        }

        .back-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.22);
            transform: translateX(-3px) !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.12s ease-out, background 0.12s ease-out, border-color 0.12s ease-out !important;
        }

        .back-btn:active {
            transform: scale(0.94) !important;
            transition: transform 0.08s ease !important;
        }

        /* Шапка профиля */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-family: monospace;
            font-size: 28px;
            margin-bottom: 6px;
        }

        /* Карточки */
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px) scale(1.008) !important;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            transition: transform 0.12s ease-out,
                        background 0.12s ease-out,
                        border-color 0.12s ease-out,
                        box-shadow 0.12s ease-out !important;
        }

        /* Блок профиля */
        .profile-card {
            justify-content: space-between;
        }

        .profile-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: #fff;
            object-fit: cover;
            transition: transform 0.18s ease-out, box-shadow 0.18s ease-out;
        }

        .avatar:hover {
            transform: scale(1.06);
            box-shadow: 0 4px 18px rgba(255, 255, 255, 0.25);
            transition: transform 0.12s ease-out, box-shadow 0.12s ease-out !important;
        }

        .profile-info h2 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .profile-info p {
            font-size: 13px;
            color: #aaa;
            max-width: 220px;
            line-height: 1.3;
        }

        /* Ссылки профиля */
        .action-links {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .action-link {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: opacity 0.18s ease-out, transform 0.18s ease-out, background 0.18s ease-out, border-color 0.18s ease-out;
        }

        .action-link:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateX(3px);
            transition: opacity 0.12s ease-out, transform 0.12s ease-out, background 0.12s ease-out !important;
        }

        .action-link:active {
            transform: scale(0.95) !important;
            transition: transform 0.08s ease !important;
        }

        /* Блок плеера */
        .player-card {
            flex-direction: column;
            margin-bottom: 0;
        }

        .player-top {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 16px;
        }

        .player-title {
            flex: 1;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 13px;
        }

        /* Линия прогресса */
        .line {
            flex: 1;
            height: 7px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
        }

        .line-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: #fff;
            border-radius: 4px;
            pointer-events: none;
        }

        .line-fill::after {
            content: '';
            position: absolute;
            right: -5px;
            top: -2.5px;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
        }

        /* Кнопки управления плеером */
        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: 12px;
            user-select: none;
        }

        .controls .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.18s ease-out, opacity 0.18s ease-out;
            opacity: 0.85;
            padding: 4px;
        }

        .controls .icon-btn:hover {
            opacity: 1;
            transform: scale(1.1);
            transition: transform 0.12s ease-out, opacity 0.12s ease-out !important;
        }

        .controls .icon-btn:active {
            transform: scale(0.88) !important;
            transition: transform 0.08s ease !important;
        }

        .icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Адаптивность для мобилок */
        @media (max-width: 520px) {
            body {
                align-items: center; /* Центрирование по вертикали */
                padding: 16px 0;
            }

            .glass-panel {
                padding: 20px 16px;
                border-radius: 20px;
            }

            .back-btn {
                top: 18px;
                left: 16px;
                padding: 4px 8px;
                font-size: 13px;
            }

            .header h1 {
                font-size: 22px;
            }

            .card {
                padding: 16px 14px;
            }

            .profile-card {
                flex-direction: column;
                text-align: center;
                gap: 16px;
            }

            .profile-left {
                flex-direction: column;
                gap: 10px;
            }

            .profile-info p {
                max-width: 100%;
            }

            .action-links {
                align-items: center;
                width: 100%;
                gap: 8px;
            }

            .action-link {
                font-size: 15px;
                padding: 8px 12px;
                background: rgba(255, 255, 255, 0.06);
                border-radius: 10px;
                width: 100%;
                text-align: center;
            }

            .action-link:hover {
                transform: none !important;
            }

            .progress-bar {
                gap: 8px;
                font-size: 12px;
            }

            .controls {
                gap: 10px;
                margin-left: 4px;
            }

            .controls .icon-btn {
                padding: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="glass-panel" id="glassPanel">

        <a href="../" class="back-btn">
            <svg class="icon" viewBox="0 0 24 24" style="width:16px; height:16px;"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            Назад
        </a>

        <div class="header">
            <h1>профиль</h1>
        </div>

        <div class="card profile-card">
            <div class="profile-left">
                <img src="images/avatar.jpg" alt="avatar" class="avatar">
                <div class="profile-info">
                    <h2>писькад</h2>
                    <p>@k0sty4pskd</p>
                </div>
            </div>

            <div class="action-links">
                <a href="https://t.me/k0sty4pskd" target="_blank" class="action-link">Telegram →</a>
                <a href="https://discord.com/users/1015892476378218546" target="_blank" class="action-link">Discord →</a>
                <a href="https://www.tiktok.com/@k0sty4pskd" target="_blank" class="action-link">TikTok →</a>
            </div>
        </div>

        <div class="card player-card">
            <div class="player-top">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                <div class="player-title" id="trackTitle">@StarGGamer_official – zxc 1000-7 I'm ghoul</div>
            </div>
            <div class="progress-bar">
                <span id="currentTime">00:00</span>
                <div class="line" id="progressContainer">
                    <div class="line-fill" id="progressFill"></div>
                </div>
                <span id="duration">00:00</span>
                <div class="controls">
                    <span class="icon-btn" id="prevBtn">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </span>
                    <span class="icon-btn" id="playBtn">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </span>
                    <span class="icon-btn" id="nextBtn">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </span>
                </div>
            </div>
        </div>

    </div>

    <audio id="audioPlayer" src="audio/musicprofile.mp3"></audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const panel = document.getElementById('glassPanel');

            // 1. Анимация открытия
            requestAnimationFrame(() => {
                setTimeout(() => {
                    document.body.classList.add('page-loaded');
                }, 50);
            });

            // 2. Быстрый режим взаимодействия
            setTimeout(() => {
                document.body.classList.add('page-ready');
            }, 900);

            // 3. Плавный переход при клике по ссылкам (включая "Назад")
            document.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', function(e) {
                    const href = this.getAttribute('href');
                    const target = this.getAttribute('target');

                    if (!href || href.startsWith('#') || href.startsWith('javascript:') || target === '_blank') {
                        return;
                    }

                    e.preventDefault();

                    document.querySelectorAll('.back-btn, .header, .card').forEach(el => {
                        el.style.transitionDelay = '0s';
                    });

                    if (panel) {
                        panel.style.transition = 'opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
                    }

                    document.body.classList.remove('page-loaded');

                    setTimeout(() => {
                        window.location.href = href;
                    }, 500);
                });
            });

            // 4. 3D Tilt Effect
            if (window.matchMedia('(hover: hover)').matches && panel) {
                panel.addEventListener('mousemove', (e) => {
                    const rect = panel.getBoundingClientRect();

                    const panelCenterX = rect.left + rect.width / 2;
                    const panelCenterY = rect.top + rect.height / 2;

                    const x = (e.clientX - panelCenterX) / (rect.width / 2);
                    const y = (e.clientY - panelCenterY) / (rect.height / 2);

                    const maxTilt = 8;

                    const tiltX = -y * maxTilt;
                    const tiltY = x * maxTilt;

                    panel.style.transition = 'transform 0.1s ease-out';
                    panel.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
                });

                panel.addEventListener('mouseleave', () => {
                    panel.style.transition = 'transform 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
                    panel.style.transform = 'rotateX(0deg) rotateY(0deg)';
                });
            }

            // 5. Логика музыкального плеера
            const audio = document.getElementById('audioPlayer');
            const playBtn = document.getElementById('playBtn');
            const currentTimeEl = document.getElementById('currentTime');
            const durationEl = document.getElementById('duration');
            const progressFill = document.getElementById('progressFill');
            const progressContainer = document.getElementById('progressContainer');

            const playIcon = '<svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
            const pauseIcon = '<svg class="icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

            function formatTime(seconds) {
                if (isNaN(seconds)) return "00:00";
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }

            playBtn.addEventListener('click', () => {
                if (audio.paused) {
                    audio.play();
                    playBtn.innerHTML = pauseIcon;
                } else {
                    audio.pause();
                    playBtn.innerHTML = playIcon;
                }
            });

            audio.addEventListener('loadedmetadata', () => {
                durationEl.textContent = formatTime(audio.duration);
            });

            audio.addEventListener('timeupdate', () => {
                if (audio.duration) {
                    const progressPercent = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = progressPercent + '%';
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                }
            });

            progressContainer.addEventListener('click', (e) => {
                const width = progressContainer.clientWidth;
                const clickX = e.offsetX;
                if (audio.duration) {
                    audio.currentTime = (clickX / width) * audio.duration;
                }
            });

            audio.addEventListener('ended', () => {
                playBtn.innerHTML = playIcon;
                progressFill.style.width = '0%';
                currentTimeEl.textContent = '00:00';
            });
        });

        // 6. Восстановление состояния при переходах "Назад" в браузерах
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                document.body.classList.add('page-loaded');
                document.body.classList.add('page-ready');
            }
        });
    </script>

</body>
</html>
